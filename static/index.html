<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾页 MiniDB</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/icons.css"><link rel="stylesheet" href="/minidb.css"><link rel="stylesheet" href="/os.css"></head>
<body><div class="app"><aside><h1>拾页图书室</h1><nav>
<button class="nav active" data-view="dashboard"><span><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10"/></svg></span>总览</button><button class="nav" data-view="books"><span><svg viewBox="0 0 24 24"><path d="M4 5.5c3.5-1 6-.3 8 1.5v13c-2-1.8-4.5-2.5-8-1.5zm16 0c-3.5-1-6-.3-8 1.5v13c2-1.8 4.5-2.5 8-1.5z"/></svg></span>图书管理</button><button class="nav" data-view="readers"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.5-4 2.8-6 7-6s6.5 2 7 6"/></svg></span>读者管理</button><button class="nav" data-view="loans"><span><svg viewBox="0 0 24 24"><path d="M5 3.5h14v17H5zM8 8h8M8 12h8M8 16h5"/></svg></span>借阅记录</button>
<button class="nav lab-nav" id="lab-nav"><span><svg viewBox="0 0 24 24"><path d="M8 3h8M9 3v5l-5 9a2.5 2.5 0 0 0 2.2 4h11.6a2.5 2.5 0 0 0 2.2-4l-5-9V3M7 15h10"/></svg></span>MiniDB 实验台</button><button class="nav lab-nav" id="os-nav"><span><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h10M7 13h3M14 13h3"/></svg></span>OS 仿真台</button></nav><div class="admin">管理员<br><small>本地数据库</small></div></aside>
<main><header><div><h2 id="title">馆藏总览</h2><p id="subtitle">掌握馆藏流转与读者借阅状态</p></div><button class="primary" id="primary">办理借阅</button></header>
<section id="content" aria-live="polite"></section></main></div>
